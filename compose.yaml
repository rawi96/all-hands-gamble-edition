services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: betoot
      POSTGRES_PASSWORD: betoot
      POSTGRES_DB: betoot
    ports:
      - "5432:5432"
    volumes:
      - betoot-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betoot"]
      interval: 3s
      retries: 10
volumes:
  betoot-data:
